[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "confdb"
version = "1.9.2"
description = "Экстрактор конфигурации 1С:Предприятие 8 (.cf/.cfe/.epf) в SQLite — только распаковка и разбор, на базе алгоритма v8unpack (MIT)"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
confdb = "confdb.__main__:main"
1confdb-knw = "confdb.mcp_server:main"
confdb-web = "confdb.webui:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
