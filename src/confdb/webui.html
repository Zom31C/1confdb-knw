<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>confdb — веб-интерфейс</title>
<style>
  :root{
    --bg:#f4f6fb; --card:#fff; --ink:#1f2733; --muted:#6b7686; --line:#e3e8f0;
    --brand:#2f6df6; --brand-d:#1f57d6; --ok:#1a9e6c; --warn:#d98324; --err:#d64545;
    --new:#2f6df6; --radius:12px; --shadow:0 1px 3px rgba(20,30,60,.08);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
       background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
  header{background:linear-gradient(120deg,#2f6df6,#5b8cff);color:#fff;padding:18px 24px}
  header h1{margin:0;font-size:20px;font-weight:650}
  header .sub{opacity:.9;font-size:13px;margin-top:3px}
  nav{display:flex;gap:6px;flex-wrap:wrap;padding:12px 24px;background:var(--card);
      border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  nav button{border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 16px;
      border-radius:999px;cursor:pointer;font-size:14px;transition:.15s}
  nav button:hover{border-color:var(--brand)}
  nav button.active{background:var(--brand);border-color:var(--brand);color:#fff}
  main{padding:22px 24px 140px;max-width:1080px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
        box-shadow:var(--shadow);padding:20px;margin-bottom:18px}
  .card h2{margin:0 0 14px;font-size:17px}
  .card h3{margin:18px 0 8px;font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .grow{flex:1;min-width:220px}
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  input[type=text],input[type=number],select{width:100%;padding:9px 11px;border:1px solid var(--line);
        border-radius:9px;font-size:14px;background:#fff;color:var(--ink)}
  input:focus,select:focus{outline:none;border-color:var(--brand)}
  .field{margin-bottom:12px}
  button.btn{border:none;background:var(--brand);color:#fff;padding:9px 18px;border-radius:9px;
        cursor:pointer;font-size:14px;font-weight:550;transition:.15s}
  button.btn:hover{background:var(--brand-d)}
  button.btn:disabled{opacity:.5;cursor:not-allowed}
  button.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
  button.ghost:hover{border-color:var(--brand);background:#f7f9ff}
  button.danger{background:var(--err)} button.danger:hover{background:#b83636}
  button.ok{background:var(--ok)} button.ok:hover{background:#158257}
  button.sm{padding:5px 11px;font-size:13px}
  .badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600}
  .b-current{background:#e4f6ee;color:var(--ok)} .b-outdated{background:#fdf0e2;color:var(--warn)}
  .b-new{background:#e7eefe;color:var(--new)} .b-active{background:#e7eefe;color:var(--brand)}
  .b-off{background:#eef1f6;color:var(--muted)}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
  tr:last-child td{border-bottom:none}
  .path{font-family:Consolas,Monaco,monospace;font-size:12.5px;color:var(--muted);word-break:break-all}
  .muted{color:var(--muted)} .small{font-size:13px}
  .checks{display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto;
        border:1px solid var(--line);border-radius:9px;padding:10px}
  .checks label{display:flex;gap:8px;align-items:center;margin:0;color:var(--ink);font-size:14px;cursor:pointer}
  .checks input{width:auto}
  .pill{display:inline-flex;align-items:center;gap:6px;background:#f0f3f9;border-radius:999px;
        padding:4px 12px;font-size:13px;margin:3px 4px 3px 0}
  .empty{color:var(--muted);padding:14px 0;text-align:center}
  #taskbar{position:fixed;left:0;right:0;bottom:0;background:#101828;color:#e7ecf5;
        border-top:2px solid var(--brand);padding:12px 24px;z-index:20;display:none}
  #taskbar .t-head{display:flex;gap:12px;align-items:center;margin-bottom:6px}
  #taskbar .t-title{font-weight:600}
  #taskbar pre{margin:0;max-height:180px;overflow:auto;font-size:12.5px;line-height:1.5;
        background:#0a1120;border-radius:8px;padding:10px;white-space:pre-wrap;word-break:break-word}
  .spin{width:15px;height:15px;border:2px solid #3b4a63;border-top-color:var(--brand);
        border-radius:50%;display:inline-block;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  #toast{position:fixed;top:16px;right:16px;z-index:50;display:flex;flex-direction:column;gap:8px}
  .toast{padding:11px 16px;border-radius:10px;color:#fff;box-shadow:var(--shadow);font-size:14px;
        animation:sl .2s ease;max-width:360px}
  .toast.ok{background:var(--ok)} .toast.err{background:var(--err)} .toast.info{background:var(--brand)}
  @keyframes sl{from{opacity:0;transform:translateX(20px)}to{opacity:1}}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:720px){.grid2{grid-template-columns:1fr}}
  .hint{font-size:12.5px;color:var(--muted);margin-top:4px}
  code{background:#eef1f6;padding:1px 6px;border-radius:5px;font-size:13px}
</style>
</head>
<body>
<header>
  <h1>confdb — база знаний конфигурации 1С:Предприятие 8</h1>
  <div class="sub">MCP-сервер 1confdb-knw · извлечение · каталог cf · группы баз · <span id="ver"></span></div>
</header>
<nav id="nav">
  <button data-tab="server" class="active">MCP-сервер</button>
  <button data-tab="extract">Извлечение</button>
  <button data-tab="catalog">Каталог cf</button>
  <button data-tab="groups">Группы баз</button>
  <button data-tab="settings">Настройки</button>
</nav>
<main id="main"></main>
<div id="taskbar">
  <div class="t-head"><span id="t-spin" class="spin"></span><span class="t-title" id="t-title"></span>
    <span class="muted small" id="t-status"></span></div>
  <pre id="t-log"></pre>
</div>
<div id="toast"></div>
<script>
"use strict";
let S = null;            // снимок состояния
let TAB = "server";
let scanRows = [];       // результат сканирования каталога cf
let lastTaskId = null;

const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const base = p => String(p).split(/[\\/]/).pop();

function toast(msg, kind="info"){
  const el = document.createElement("div");
  el.className = "toast " + kind; el.textContent = msg;
  $("#toast").appendChild(el);
  setTimeout(()=>el.remove(), 4200);
}
async function api(path, method="GET", body){
  const opt = {method, headers:{}};
  if(body!==undefined){ opt.headers["Content-Type"]="application/json"; opt.body=JSON.stringify(body); }
  const r = await fetch(path, opt);
  const data = await r.json().catch(()=>({error:"некорректный ответ сервера"}));
  if(!r.ok || data.error) throw new Error(data.error || ("HTTP "+r.status));
  return data;
}
async function refresh(){ S = await api("/api/state"); $("#ver").textContent = "v"+S.version; render(); }

// ---------- навигация ----------
$("#nav").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  TAB = b.dataset.tab;
  document.querySelectorAll("#nav button").forEach(x=>x.classList.toggle("active", x===b));
  render();
});
function render(){
  if(!S) return;
  const m = $("#main");
  if(TAB==="server") m.innerHTML = viewServer();
  else if(TAB==="extract") m.innerHTML = viewExtract();
  else if(TAB==="catalog") m.innerHTML = viewCatalog();
  else if(TAB==="groups") m.innerHTML = viewGroups();
  else if(TAB==="settings") m.innerHTML = viewSettings();
  bind();
}

// ---------- вкладка: MCP-сервер ----------
function viewServer(){
  const sv = S.server;
  if(!sv.running){
    const groups = Object.keys(S.groups);
    const gHtml = groups.length ? groups.map(n=>
      `<label><input type="checkbox" class="srv-group" value="${esc(n)}">
       <span><b>${esc(n)}</b> <span class="muted small">${esc(S.groups[n].map(base).join(", "))}</span></span></label>`).join("")
      : `<div class="empty">Групп нет — создайте на вкладке «Группы баз».</div>`;
    const dHtml = S.db_candidates.map(p=>
      `<label><input type="checkbox" class="srv-db" value="${esc(p)}"> <span class="path">${esc(p)}</span></label>`).join("")
      || `<div class="empty">Базы не найдены — укажите каталог в настройках.</div>`;
    return `<div class="card"><h2>Запуск MCP-сервера</h2>
      <p class="muted small">Отметьте группы и/или отдельные базы. Группы откроются одновременно и останутся раздельными (запрос к группе — параметр <code>group</code>).</p>
      <h3>Группы баз</h3><div class="checks">${gHtml}</div>
      <h3>Отдельные базы</h3><div class="checks">${dHtml}</div>
      <div class="row" style="margin-top:14px">
        <div style="width:140px"><label>Порт</label><input type="number" id="srv-port" value="8765"></div>
        <button class="btn" id="srv-start" style="align-self:flex-end">Запустить сервер</button>
      </div></div>`;
  }
  const dbs = sv.dbs.map(d=>`<tr>
      <td>${d.active?'<span class="badge b-active">активна</span>':`<button class="btn ghost sm" data-use="${esc(d.alias)}">сделать активной</button>`}</td>
      <td><b>${esc(d.alias)}</b>${d.outdated?' <span class="badge b-outdated">устарела</span>':''}<div class="path">${esc(d.path)}</div></td>
      <td><button class="btn ghost sm" data-close="${esc(d.alias)}">закрыть</button></td></tr>`).join("")
    || `<tr><td colspan="3" class="empty">Нет открытых баз.</td></tr>`;
  const groups = sv.groups.map(g=>`<tr>
      <td>${g.active?'<span class="badge b-active">активна</span>':`<button class="btn ghost sm" data-guse="${esc(g.name)}">активировать</button>`}</td>
      <td><b>${esc(g.name)}</b><div class="muted small">${esc(g.aliases.join(", "))||"(пусто)"}</div></td>
      <td><button class="btn ghost sm" data-gclose="${esc(g.name)}">убрать</button></td></tr>`).join("")
    || `<tr><td colspan="3" class="empty">Групп в сервере нет.</td></tr>`;
  const cfgGroups = Object.keys(S.groups).map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join("");
  const aliasOpts = sv.dbs.map(d=>`<option value="${esc(d.alias)}">${esc(d.alias)}</option>`).join("");
  return `<div class="card"><h2>Сервер запущен</h2>
    <div class="row"><span class="badge b-current">работает</span>
      <code id="srv-url">${esc(sv.url)}</code>
      <button class="btn ghost sm" id="copy-url">копировать</button>
      <span class="grow"></span>
      <button class="btn danger" id="srv-stop">Остановить сервер</button></div>
    <p class="hint">Конфигурация клиента: <code>{"mcpServers":{"1confdb-knw":{"url":"${esc(sv.url)}"}}}</code>. Остановка закрывает базы и освобождает файлы для пересборки.</p>
    <h3>Открытые базы</h3><table><tbody>${dbs}</tbody></table>
    <div class="row" style="margin-top:12px"><div class="grow"><label>Открыть ещё базу (путь к .db/.sqlite)</label>
      <input type="text" id="open-path" placeholder="D:\\bases\\ext.sqlite"></div>
      <button class="btn ghost" id="open-db" style="align-self:flex-end">Открыть</button></div>
    <h3>Группы конфигураций в сервере</h3><table><tbody>${groups}</tbody></table>
    <div class="grid2" style="margin-top:12px">
      <div class="row"><div class="grow"><label>Новая группа</label><input type="text" id="ng-name" placeholder="имя"></div>
        <button class="btn ghost" id="ng-create" style="align-self:flex-end">Создать</button></div>
      <div class="row"><div class="grow"><label>Добавить базу в группу</label>
        <select id="ag-group">${sv.groups.map(g=>`<option>${esc(g.name)}</option>`).join("")}</select></div>
        <div class="grow"><label>&nbsp;</label><select id="ag-alias">${aliasOpts}</select></div>
        <button class="btn ghost" id="ag-add" style="align-self:flex-end">Добавить</button></div>
    </div>
    <h3>Группы из конфига</h3>
    <div class="row"><div class="grow"><select id="cfg-group">${cfgGroups||'<option value="">— нет групп —</option>'}</select></div>
      <button class="btn ghost" id="cfg-add">Добавить в сервер</button>
      <button class="btn ghost" id="cfg-replace">Заменить всё</button></div>
    </div>`;
}

// ---------- вкладка: Извлечение ----------
function viewExtract(){
  const opts = S.options;
  const cfOpts = S.cf_candidates.map(p=>`<option value="${esc(p)}">${esc(base(p))} — ${esc(p)}</option>`).join("");
  return `<div class="card"><h2>Извлечение конфигурации</h2>
    <p class="muted small">Файл .cf/.cfe/.epf/.erf либо каталог выгрузки конфигурации в файлы (для выгрузки — инкрементальное обновление при повторном запуске).</p>
    <div class="field"><label>Файл 1С или каталог выгрузки</label>
      <select id="ex-src-sel"><option value="">— выбрать из списка —</option>${cfOpts}</select>
      <input type="text" id="ex-src" style="margin-top:8px" placeholder="или путь вручную" value="${esc(opts.src)}"></div>
    <div class="grid2">
      <div class="field"><label>База SQLite (пусто — по умолчанию в _out)</label>
        <input type="text" id="ex-db" value="${esc(opts.db)}" placeholder="D:\\out\\base.sqlite"></div>
      <div class="field"><label>Дамп дерева (пусто — не сохранять)</label>
        <input type="text" id="ex-dump" value="${esc(opts.dump)}" placeholder="D:\\out\\base"></div>
    </div>
    <div class="row"><button class="btn" id="ex-run">Извлечь</button>
      <span class="muted small">Процессов: ${opts.workers} · FTS: ${opts.build_fts?"да":"нет"} · настройки — на вкладке «Настройки»</span></div>
    </div>
    <div class="card"><h2>FTS-индекс по телам методов</h2>
    <p class="muted small">Достроить приставной индекс для готовой базы (без него поиск по телам идёт полным проходом).</p>
    <div class="row"><div class="grow"><select id="fts-db">${S.db_candidates.map(p=>`<option value="${esc(p)}">${esc(base(p))}</option>`).join("")}</select></div>
      <button class="btn ghost" id="fts-run">Построить FTS</button></div></div>`;
}

// ---------- вкладка: Каталог cf ----------
function viewCatalog(){
  const rows = scanRows.map((r,i)=>{
    const badge = r.status==="current"?'<span class="badge b-current">актуальна</span>'
      : r.status==="outdated"?'<span class="badge b-outdated">устарела</span>'
      : '<span class="badge b-new">новая</span>';
    const check = r.status==="current"?"":`<input type="checkbox" class="scan-check" data-i="${i}">`;
    const target = r.status==="current"?"":`<div class="path">→ ${esc(r.db)}${r.status==="outdated"?" (замена)":""}</div>`;
    return `<tr><td>${check}</td><td>${badge}</td>
      <td><b>${esc(base(r.src))}</b>${target}${r.note?`<div class="hint">${esc(r.note)}</div>`:""}</td></tr>`;
  }).join("");
  const table = scanRows.length?`<table><thead><tr><th></th><th>Статус</th><th>Конфигурация</th></tr></thead><tbody>${rows}</tbody></table>`
    :`<div class="empty">Нажмите «Сканировать», чтобы сверить файлы каталога с базами по SHA-256.</div>`;
  const actionable = scanRows.filter(r=>r.status!=="current").length;
  return `<div class="card"><h2>Каталог cf — новые и устаревшие конфигурации</h2>
    <div class="row"><div class="grow"><label>Каталог с файлами 1С</label>
      <input type="text" id="cat-dir" value="${esc(S.options.cf_dir)}" placeholder="D:\\cf"></div>
      <button class="btn ghost" id="cat-save" style="align-self:flex-end">Сохранить</button>
      <button class="btn" id="cat-scan" style="align-self:flex-end">Сканировать</button></div>
    <p class="hint">Сканирование считает SHA-256 каждого файла и сверяет с базами: <span class="badge b-current">актуальна</span> — уже собрана; <span class="badge b-outdated">устарела</span> — другой хэш, будет заменена; <span class="badge b-new">новая</span> — базы нет.</p>
    ${table}
    ${actionable?`<div class="row" style="margin-top:14px">
      <button class="btn" id="cat-selected">Извлечь выбранные</button>
      <button class="btn ok" id="cat-all">Все новые и устаревшие (${actionable})</button></div>`:""}
    </div>`;
}

// ---------- вкладка: Группы баз ----------
function viewGroups(){
  const names = Object.keys(S.groups);
  const list = names.map(n=>`<div class="card" style="padding:14px 18px">
    <div class="row"><b>${esc(n)}</b><span class="grow"></span>
      <button class="btn ghost sm" data-edit="${esc(n)}">изменить</button>
      <button class="btn danger sm" data-del="${esc(n)}">удалить</button></div>
    <div style="margin-top:6px">${S.groups[n].map(p=>`<span class="pill path">${esc(base(p))}</span>`).join("")||'<span class="muted">пусто</span>'}</div>
    </div>`).join("") || `<div class="card empty">Групп пока нет.</div>`;
  const dbChecks = S.db_candidates.map(p=>`<label><input type="checkbox" class="grp-db" value="${esc(p)}"> <span class="path">${esc(p)}</span></label>`).join("")
    || `<div class="empty">Базы не найдены.</div>`;
  return `<div class="card"><h2>Группы баз для MCP-сервера</h2>
    <p class="muted small">База может входить в несколько групп. Первая база группы становится активной при запуске.</p>
    ${list}</div>
    <div class="card"><h2 id="grp-form-title">Создать группу</h2>
    <div class="field"><label>Имя группы</label><input type="text" id="grp-name" placeholder="например, БП"></div>
    <label>Базы группы (порядок выбора = порядок баз; первая — основная)</label>
    <div class="checks">${dbChecks}</div>
    <div class="row" style="margin-top:12px"><button class="btn" id="grp-save">Сохранить группу</button>
      <button class="btn ghost" id="grp-reset">Очистить</button></div></div>`;
}

// ---------- вкладка: Настройки ----------
function viewSettings(){
  const o = S.options;
  const chk = (id,val,label)=>`<label style="display:flex;gap:8px;align-items:center;margin-bottom:8px;color:var(--ink);font-size:14px">
    <input type="checkbox" id="${id}" ${val?"checked":""} style="width:auto"> ${label}</label>`;
  const cfOpts = S.cf_candidates.map(p=>`<option value="${esc(p)}">${esc(base(p))}</option>`).join("");
  return `<div class="card"><h2>Опции извлечения</h2>
    <div class="grid2">
      <div class="field"><label>Число процессов стадии 3</label><input type="number" id="opt-workers" min="1" value="${o.workers}"></div>
      <div class="field"><label>Рабочий каталог стадий 0–1 (пусто — на томе базы)</label><input type="text" id="opt-temp" value="${esc(o.temp)}"></div>
      <div class="field"><label>Префикс имён для снятия</label><input type="text" id="opt-prefix" value="${esc(o.prefix)}"></div>
      <div class="field"><label>Каталог с файлами 1С</label><input type="text" id="opt-cf_dir" value="${esc(o.cf_dir)}"></div>
    </div>
    ${chk("opt-keep_temp",o.keep_temp,"Не удалять рабочий каталог")}
    ${chk("opt-store_blobs",o.store_blobs,"Хранить бинарники (BLOB)")}
    ${chk("opt-skip_errors",o.skip_errors,"Пропускать ошибки объектов (--skip-errors)")}
    ${chk("opt-build_fts",o.build_fts,"Строить FTS-индекс по телам методов")}
    <div class="row" style="margin-top:12px"><button class="btn" id="opt-save">Сохранить настройки</button></div></div>
    <div class="card"><h2>Каталоги баз</h2>
    <p class="muted small">Каталоги, где искать базы SQLite для выбора.</p>
    <div>${S.db_dirs.map(d=>`<span class="pill path">${esc(d)}</span>`).join("")||'<span class="muted">нет</span>'}</div>
    <div class="row" style="margin-top:10px"><div class="grow"><input type="text" id="dbdir-path" placeholder="D:\\bases"></div>
      <button class="btn ghost" id="dbdir-add">Добавить каталог</button></div></div>
    <div class="card"><h2>Бенчмарк</h2>
    <p class="muted small">Подобрать число процессов под железо (прогон сэмпла объектов).</p>
    <div class="row"><div class="grow"><select id="bench-src">${cfOpts||'<option value="">— нет файлов —</option>'}</select></div>
      <button class="btn ghost" id="bench-run">Запустить бенчмарк</button></div></div>`;
}

// ---------- привязка обработчиков ----------
function bind(){
  const on = (id,ev,fn)=>{ const el=$("#"+id); if(el) el.addEventListener(ev,fn); };
  const val = id => ($("#"+id)?$("#"+id).value:"");
  const checked = id => $("#"+id) && $("#"+id).checked;

  // сервер
  on("srv-start","click",async()=>{
    const groups=[...document.querySelectorAll(".srv-group:checked")].map(x=>x.value);
    const dbs=[...document.querySelectorAll(".srv-db:checked")].map(x=>x.value);
    try{ const r=await api("/api/server/start","POST",{dbs,groups,port:val("srv-port")});
      if(r.missing&&r.missing.length) toast("Пропущены (нет файла): "+r.missing.map(base).join(", "),"info");
      toast("Сервер запущен на порту "+r.port,"ok"); await refresh();
    }catch(e){ toast(e.message,"err"); }
  });
  on("srv-stop","click",async()=>{ try{ await api("/api/server/stop","POST",{}); toast("Сервер остановлен, базы закрыты","ok"); await refresh(); }catch(e){ toast(e.message,"err"); } });
  on("copy-url","click",()=>{ navigator.clipboard&&navigator.clipboard.writeText($("#srv-url").textContent); toast("URL скопирован","ok"); });
  on("open-db","click",async()=>{ try{ const r=await api("/api/server/open","POST",{path:val("open-path")}); toast("Открыта база: "+r.alias,"ok"); await refresh(); }catch(e){ toast(e.message,"err"); } });
  on("ng-create","click",async()=>{ try{ await api("/api/server/group/create","POST",{name:val("ng-name")}); await refresh(); }catch(e){ toast(e.message,"err"); } });
  on("ag-add","click",async()=>{ try{ await api("/api/server/group/add","POST",{group:val("ag-group"),alias:val("ag-alias")}); await refresh(); }catch(e){ toast(e.message,"err"); } });
  on("cfg-add","click",()=>applyCfg(false));
  on("cfg-replace","click",()=>applyCfg(true));
  document.querySelectorAll("[data-use]").forEach(b=>b.onclick=async()=>{ try{ await api("/api/server/use","POST",{alias:b.dataset.use}); await refresh(); }catch(e){ toast(e.message,"err"); } });
  document.querySelectorAll("[data-close]").forEach(b=>b.onclick=async()=>{ try{ await api("/api/server/close","POST",{alias:b.dataset.close}); await refresh(); }catch(e){ toast(e.message,"err"); } });
  document.querySelectorAll("[data-guse]").forEach(b=>b.onclick=async()=>{ try{ await api("/api/server/group/use","POST",{name:b.dataset.guse}); await refresh(); }catch(e){ toast(e.message,"err"); } });
  document.querySelectorAll("[data-gclose]").forEach(b=>b.onclick=async()=>{ try{ await api("/api/server/group/close","POST",{name:b.dataset.gclose}); await refresh(); }catch(e){ toast(e.message,"err"); } });

  // извлечение
  on("ex-src-sel","change",()=>{ if(val("ex-src-sel")) $("#ex-src").value=val("ex-src-sel"); });
  on("ex-run","click",async()=>{ const src=val("ex-src").trim(); if(!src){toast("Укажите файл или каталог","err");return;}
    try{ await api("/api/extract","POST",{src,db:val("ex-db"),dump:val("ex-dump")}); toast("Извлечение запущено","ok"); pollTask(); }catch(e){ toast(e.message,"err"); } });
  on("fts-run","click",async()=>{ try{ await api("/api/fts","POST",{db:val("fts-db")}); toast("Построение FTS запущено","ok"); pollTask(); }catch(e){ toast(e.message,"err"); } });

  // каталог cf
  on("cat-save","click",async()=>{ try{ await api("/api/options","POST",{cf_dir:val("cat-dir")}); toast("Каталог сохранён","ok"); await refresh(); }catch(e){ toast(e.message,"err"); } });
  on("cat-scan","click",async()=>{ try{ await api("/api/options","POST",{cf_dir:val("cat-dir")}); await api("/api/scan","POST",{}); toast("Сканирование запущено","ok"); pollTask(); }catch(e){ toast(e.message,"err"); } });
  on("cat-selected","click",()=>batchSelected(false));
  on("cat-all","click",()=>batchSelected(true));

  // группы
  on("grp-save","click",async()=>{ const name=val("grp-name").trim(); if(!name){toast("Укажите имя группы","err");return;}
    const paths=[...document.querySelectorAll(".grp-db:checked")].map(x=>x.value);
    try{ await api("/api/groups","POST",{name,paths}); toast("Группа сохранена","ok"); await refresh(); }catch(e){ toast(e.message,"err"); } });
  on("grp-reset","click",()=>{ $("#grp-name").value=""; document.querySelectorAll(".grp-db").forEach(x=>x.checked=false); $("#grp-form-title").textContent="Создать группу"; });
  document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{ const n=b.dataset.edit; $("#grp-name").value=n; $("#grp-form-title").textContent="Изменить группу «"+n+"»";
    const set=new Set(S.groups[n]||[]); document.querySelectorAll(".grp-db").forEach(x=>x.checked=set.has(x.value)); window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"}); });
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{ if(!confirm("Удалить группу «"+b.dataset.del+"»?"))return;
    try{ await api("/api/groups/delete","POST",{name:b.dataset.del}); toast("Группа удалена","ok"); await refresh(); }catch(e){ toast(e.message,"err"); } });

  // настройки
  on("opt-save","click",async()=>{ const body={workers:val("opt-workers"),temp:val("opt-temp"),prefix:val("opt-prefix"),cf_dir:val("opt-cf_dir"),
      keep_temp:checked("opt-keep_temp"),store_blobs:checked("opt-store_blobs"),skip_errors:checked("opt-skip_errors"),build_fts:checked("opt-build_fts")};
    try{ await api("/api/options","POST",body); toast("Настройки сохранены","ok"); await refresh(); }catch(e){ toast(e.message,"err"); } });
  on("dbdir-add","click",async()=>{ try{ await api("/api/db_dir","POST",{path:val("dbdir-path")}); toast("Каталог добавлен","ok"); await refresh(); }catch(e){ toast(e.message,"err"); } });
  on("bench-run","click",async()=>{ const src=val("bench-src"); if(!src){toast("Выберите файл","err");return;}
    try{ await api("/api/bench","POST",{src}); toast("Бенчмарк запущен","ok"); pollTask(); }catch(e){ toast(e.message,"err"); } });
}
async function applyCfg(replace){
  const name=val("cfg-group"); if(!name){toast("Нет групп в конфиге","err");return;}
  try{ const r=await api("/api/server/apply_group","POST",{name,replace});
    const res=r.result; toast("Группа "+res[0]+": "+(res[1].join(", ")||"без баз"), "ok");
    if(res[2]&&res[2].length) toast("Ошибки: "+res[2].join("; "),"err"); await refresh();
  }catch(e){ toast(e.message,"err"); }
}
function batchSelected(all){
  let items;
  if(all) items=scanRows.filter(r=>r.status!=="current");
  else items=[...document.querySelectorAll(".scan-check:checked")].map(x=>scanRows[+x.dataset.i]);
  if(!items.length){toast("Не выбрано ни одной конфигурации","err");return;}
  const repl=items.filter(r=>r.status==="outdated").length;
  if(!confirm("Извлечь "+items.length+" конфигурац."+ (repl?" (с заменой баз: "+repl+")":"") +"?"))return;
  api("/api/extract_batch","POST",{items:items.map(r=>({src:r.src,db:r.db,sha:r.sha}))})
    .then(()=>{toast("Пакетное извлечение запущено","ok");pollTask();})
    .catch(e=>toast(e.message,"err"));
}

// ---------- задачи ----------
async function pollTask(){
  try{
    const {task} = await api("/api/task");
    const bar=$("#taskbar");
    if(!task){ bar.style.display="none"; return; }
    bar.style.display="block";
    $("#t-title").textContent=task.title;
    $("#t-spin").style.display=task.status==="running"?"inline-block":"none";
    $("#t-status").textContent=task.status==="running"?"выполняется…"
      :task.status==="done"?"готово":"ошибка";
    const log=$("#t-log"); log.textContent=task.log.join("\n"); log.scrollTop=log.scrollHeight;
    if(task.status!=="running" && task.id!==lastTaskId){
      lastTaskId=task.id;
      if(task.status==="done"){
        if(task.kind==="scan"){ scanRows=task.result||[]; toast("Сканирование завершено","ok"); }
        else if(task.kind==="batch"){ const r=task.result; toast("Извлечено: "+r.done.length+", ошибок: "+r.failed.length, r.failed.length?"err":"ok"); }
        else if(task.kind==="bench"){ toast("Бенчмарк: рекомендовано процессов "+task.result,"ok"); }
        else toast("Задача завершена","ok");
        await refresh();
      } else { toast(task.error||"Ошибка задачи","err"); }
    }
  }catch(e){ /* сервер недоступен — тихо */ }
}
setInterval(pollTask, 1000);
setInterval(()=>{ if(TAB==="server" && S && S.server.running) refresh(); }, 3000);
refresh().catch(e=>toast("Не удалось загрузить состояние: "+e.message,"err"));
</script>
</body>
