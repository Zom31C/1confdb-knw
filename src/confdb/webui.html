<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>confdb — веб-интерфейс</title>
<style>
  :root{
    --bg:#eef1f8; --card:#fff; --ink:#1c2430; --muted:#647082; --line:#e2e7f0;
    --brand:#2f6df6; --brand-d:#1e56d6; --brand-soft:#e8eefe; --accent:#f5a623;
    --ok:#1a9e6c; --warn:#d98324; --err:#d64545; --info:#2f6df6; --new:#2f6df6;
    --log-bg:#0e1726; --log-bg2:#0a1120; --log-ink:#dfe6f2; --log-muted:#8593ab; --log-line:#1d2a40;
    --radius:12px; --shadow:0 1px 3px rgba(20,30,60,.08); --nav-h:58px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
       background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;
       display:flex;flex-direction:column;overflow:hidden}
  /* палитровые скроллбары вместо браузерных */
  *{scrollbar-width:thin;scrollbar-color:#c3ccdd transparent}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#c3ccdd;border-radius:8px;border:2px solid var(--bg)}
  ::-webkit-scrollbar-thumb:hover{background:var(--brand)}
  header{flex:0 0 auto;color:#fff;padding:16px 24px;display:flex;align-items:center;gap:14px;
       background:
         radial-gradient(120% 140% at 85% -20%, rgba(245,166,35,.28), transparent 45%),
         radial-gradient(120% 160% at 100% 120%, rgba(91,140,255,.55), transparent 50%),
         linear-gradient(120deg,#1e56d6,#2f6df6 55%,#4d82ff);
       box-shadow:0 2px 14px rgba(20,40,90,.18)}
  .brand-mark{flex:0 0 auto;width:40px;height:40px;border-radius:11px;display:flex;align-items:center;
       justify-content:center;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28)}
  .brand-mark svg{width:24px;height:24px}
  header .htext{min-width:0}
  header h1{margin:0;font-size:19px;font-weight:650;letter-spacing:.01em}
  header .sub{opacity:.92;font-size:12.5px;margin-top:2px}
  nav{flex:0 0 auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:11px 24px;
      background:var(--card);border-bottom:1px solid var(--line);position:relative;z-index:8}
  nav button{border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 16px;
      border-radius:999px;cursor:pointer;font-size:14px;transition:.15s}
  nav button:hover{border-color:var(--brand);background:var(--brand-soft)}
  nav button.active{background:var(--brand);border-color:var(--brand);color:#fff}
  .nav-spacer{flex:1 1 auto}
  .log-toggle{display:inline-flex;align-items:center;gap:8px;font-weight:550}
  .log-toggle .lt-badge{width:8px;height:8px;border-radius:50%;background:var(--accent);display:none}
  .log-toggle.running .lt-badge{display:inline-block;animation:pulse 1.2s ease-in-out infinite}
  .log-toggle.active{background:var(--brand);border-color:var(--brand);color:#fff}
  /* двухколоночный рабочий стол: контент слева, журнал справа */
  .workspace{flex:1 1 auto;display:flex;min-height:0;position:relative}
  main{flex:1 1 auto;min-width:0;overflow-y:auto;padding:22px 26px;scroll-behavior:smooth}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
        box-shadow:var(--shadow);padding:20px;margin:0 auto 18px;max-width:1040px}
  .card h2{margin:0 0 14px;font-size:17px}
  .card h3{margin:18px 0 8px;font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .grow{flex:1;min-width:220px}
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  input[type=text],input[type=number],select{width:100%;padding:9px 11px;border:1px solid var(--line);
        border-radius:9px;font-size:14px;background:#fff;color:var(--ink)}
  input:focus,select:focus{outline:none;border-color:var(--brand)}
  .field{margin-bottom:12px}
  button.btn{border:none;background:var(--brand);color:#fff;padding:9px 18px;border-radius:9px;
        cursor:pointer;font-size:14px;font-weight:550;transition:.15s}
  button.btn:hover{background:var(--brand-d)}
  button.btn:disabled{opacity:.5;cursor:not-allowed}
  button.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
  button.ghost:hover{border-color:var(--brand);background:#f7f9ff}
  button.danger{background:var(--err)} button.danger:hover{background:#b83636}
  button.ok{background:var(--ok)} button.ok:hover{background:#158257}
  button.sm{padding:5px 11px;font-size:13px}
  .badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600}
  .b-current{background:#e4f6ee;color:var(--ok)} .b-outdated{background:#fdf0e2;color:var(--warn)}
  .b-new{background:#e7eefe;color:var(--new)} .b-active{background:#e7eefe;color:var(--brand)}
  .b-off{background:#eef1f6;color:var(--muted)}
  /* тип файла 1С: cf — конфигурация, cfe — расширение, epf — обработка, erf — отчёт */
  .t-cf{background:#e7eefe;color:#2f6df6} .t-cfe{background:#efe7fb;color:#7c4dcc}
  .t-epf{background:#fdf0e2;color:#d98324} .t-erf{background:#e4f6ee;color:#1a9e6c}
  .t-x{background:#eef1f6;color:var(--muted)}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
  tr:last-child td{border-bottom:none}
  .path{font-family:Consolas,Monaco,monospace;font-size:12.5px;color:var(--muted);word-break:break-all}
  .muted{color:var(--muted)} .small{font-size:13px}
  .checks{display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto;
        border:1px solid var(--line);border-radius:9px;padding:10px}
  .checks label{display:flex;gap:8px;align-items:center;margin:0;color:var(--ink);font-size:14px;cursor:pointer}
  .checks input{width:auto}
  .pill{display:inline-flex;align-items:center;gap:6px;background:#f0f3f9;border-radius:999px;
        padding:4px 12px;font-size:13px;margin:3px 4px 3px 0}
  .empty{color:var(--muted);padding:14px 0;text-align:center}
  /* правая колонка журнала задач (сворачиваемая) */
  .logpanel{flex:0 0 auto;width:400px;overflow:hidden;color:var(--log-ink);position:relative;z-index:7;
        background:linear-gradient(180deg,var(--log-bg),var(--log-bg2));
        border-left:1px solid #0a1120;transition:width .28s cubic-bezier(.4,0,.2,1)}
  .logpanel-inner{width:400px;height:100%;display:flex;flex-direction:column}
  .workspace.collapsed .logpanel{width:0;border-left-color:transparent}
  .log-head{display:flex;align-items:center;gap:10px;padding:13px 14px 13px 16px;border-bottom:1px solid var(--log-line)}
  .log-title{font-weight:650;font-size:14px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .log-actions{display:flex;gap:6px;flex:0 0 auto}
  .iconbtn{width:30px;height:30px;border-radius:8px;border:1px solid var(--log-line);background:#131f33;
        color:var(--log-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;
        transition:.15s;font-size:15px;line-height:1;padding:0}
  .iconbtn:hover{color:#fff;border-color:var(--brand);background:#1a2942}
  .iconbtn.on{color:#7fa6ff;border-color:var(--brand)}
  .log-status{display:flex;align-items:center;gap:9px;padding:9px 16px;font-size:12.5px;
        color:var(--log-muted);border-bottom:1px solid var(--log-line)}
  .dot{width:9px;height:9px;border-radius:50%;background:#3b4a63;flex:0 0 auto}
  .dot.run{background:var(--accent);animation:pulse 1.2s ease-in-out infinite}
  .dot.done{background:var(--ok)} .dot.err{background:var(--err)}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(245,166,35,.5)}50%{box-shadow:0 0 0 6px rgba(245,166,35,0)}}
  .log-body{flex:1;min-height:0;overflow-y:auto;margin:0;padding:14px 16px;color:var(--log-ink);
        font-family:Consolas,Monaco,monospace;font-size:12.5px;line-height:1.6;
        white-space:pre-wrap;word-break:break-word;scrollbar-color:#2a3a55 var(--log-bg2)}
  .log-body::-webkit-scrollbar-track{background:var(--log-bg2)}
  .log-body::-webkit-scrollbar-thumb{background:#2a3a55;border:2px solid var(--log-bg2)}
  .log-body::-webkit-scrollbar-thumb:hover{background:var(--brand)}
  .log-body .ll{padding:0 0 1px}
  .log-body .ll-stage{color:#7fa6ff;font-weight:600}
  .log-body .ll-ok{color:#5fd39a}
  .log-body .ll-err{color:#ff8585}
  .log-body .ll-dim{color:var(--log-muted)}
  .log-empty{flex:1;min-height:0;display:none;flex-direction:column;align-items:center;justify-content:center;
        gap:12px;text-align:center;color:var(--log-muted);padding:24px}
  .log-empty svg{width:46px;height:46px;opacity:.55}
  .log-empty .le-t{font-size:14px;font-weight:600;color:var(--log-ink)}
  .log-empty .le-s{font-size:12.5px;max-width:260px;line-height:1.5}
  .log-foot{padding:9px 16px;border-top:1px solid var(--log-line);font-size:12px;color:var(--log-muted);
        display:flex;gap:10px;align-items:center;min-height:38px}
  .spin{width:15px;height:15px;border:2px solid #3b4a63;border-top-color:var(--accent);
        border-radius:50%;display:none;animation:sp .8s linear infinite;flex:0 0 auto}
  @keyframes sp{to{transform:rotate(360deg)}}
  .scrim{display:none}
  /* узкие экраны: журнал — выдвижная панель справа поверх контента */
  @media(max-width:1100px){
    .logpanel{position:fixed;top:0;right:0;height:100vh;width:min(400px,92vw);z-index:40;
        transform:translateX(105%);transition:transform .28s cubic-bezier(.4,0,.2,1);
        box-shadow:-8px 0 30px rgba(8,14,28,.35);border-left:1px solid var(--log-line)}
    .logpanel-inner{width:min(400px,92vw)}
    .workspace.collapsed .logpanel{width:min(400px,92vw);transform:translateX(105%)}
    .workspace:not(.collapsed) .logpanel{transform:translateX(0)}
    .workspace:not(.collapsed) .scrim{display:block;position:fixed;inset:0;z-index:35;
        background:rgba(8,14,28,.5);backdrop-filter:blur(2px)}
    .card{max-width:none}
  }
  #toast{position:fixed;top:16px;right:16px;z-index:50;display:flex;flex-direction:column;gap:8px}
  .toast{padding:11px 16px;border-radius:10px;color:#fff;box-shadow:var(--shadow);font-size:14px;
        animation:sl .2s ease;max-width:360px}
  .toast.ok{background:var(--ok)} .toast.err{background:var(--err)} .toast.info{background:var(--brand)}
  @keyframes sl{from{opacity:0;transform:translateX(20px)}to{opacity:1}}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:720px){.grid2{grid-template-columns:1fr}}
  .hint{font-size:12.5px;color:var(--muted);margin-top:4px}
  code{background:#eef1f6;padding:1px 6px;border-radius:5px;font-size:13px}
</style>
</head>
<body>
<header>
  <div class="brand-mark" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="12" cy="5.5" rx="7.5" ry="3"/>
      <path d="M4.5 5.5v6c0 1.66 3.36 3 7.5 3s7.5-1.34 7.5-3v-6"/>
      <path d="M4.5 11.5v6c0 1.66 3.36 3 7.5 3s7.5-1.34 7.5-3v-6"/>
    </svg>
  </div>
  <div class="htext">
    <h1>confdb — база знаний конфигурации 1С:Предприятие 8</h1>
    <div class="sub">MCP-сервер 1confdb-knw · извлечение · каталог cf · группы баз · <span id="ver"></span></div>
  </div>
</header>
<nav id="nav">
  <button data-tab="server" class="active">MCP-сервер</button>
  <button data-tab="extract">Извлечение</button>
  <button data-tab="catalog">Каталог cf</button>
  <button data-tab="groups">Группы баз</button>
  <button data-tab="settings">Настройки</button>
  <span class="nav-spacer"></span>
  <button id="log-toggle" class="log-toggle" title="Показать/скрыть журнал задач">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h10M4 18h7"/></svg>
    Журнал <span class="lt-badge"></span>
  </button>
</nav>
<div class="workspace" id="workspace">
  <main id="main"></main>
  <aside class="logpanel" id="logpanel" aria-label="Журнал задач">
    <div class="logpanel-inner">
      <div class="log-head">
        <span id="t-spin" class="spin"></span>
        <span class="log-title" id="t-title">Журнал задач</span>
        <div class="log-actions">
          <button class="iconbtn on" id="log-autoscroll" title="Автопрокрутка к последней строке">⤓</button>
          <button class="iconbtn" id="log-copy" title="Копировать журнал">⧉</button>
          <button class="iconbtn" id="log-collapse" title="Свернуть панель">✕</button>
        </div>
      </div>
      <div class="log-status"><span class="dot" id="t-dot"></span><span id="t-status">Задачи не запускались</span></div>
      <pre class="log-body" id="t-log"></pre>
      <div class="log-empty" id="log-empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3M13 15h4"/>
        </svg>
        <div class="le-t">Задач пока нет</div>
        <div class="le-s">Здесь появится ход извлечения, сканирования каталога cf, построения FTS или бенчмарка.</div>
      </div>
      <div class="log-foot" id="t-foot"></div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>
</div>
<div id="toast"></div>
<script>
"use strict";
let S = null;            // снимок состояния
let TAB = "server";
let scanRows = [];       // результат сканирования каталога cf
let lastTaskId = null;

const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const base = p => String(p).split(/[\\/]/).pop();
const val = id => { const el = $("#"+id); return el ? el.value : ""; };

function toast(msg, kind="info"){
  const el = document.createElement("div");
  el.className = "toast " + kind; el.textContent = msg;
  $("#toast").appendChild(el);
  setTimeout(()=>el.remove(), 4200);
}
async function api(path, method="GET", body){
  const opt = {method, headers:{}};
  if(body!==undefined){ opt.headers["Content-Type"]="application/json"; opt.body=JSON.stringify(body); }
  const r = await fetch(path, opt);
  const data = await r.json().catch(()=>({error:"некорректный ответ сервера"}));
  if(!r.ok || data.error) throw new Error(data.error || ("HTTP "+r.status));
  return data;
}
async function refresh(){ S = await api("/api/state"); $("#ver").textContent = "v"+S.version; render(); }

// ---------- навигация ----------
$("#nav").addEventListener("click", e=>{
  const b = e.target.closest("button[data-tab]"); if(!b) return;
  TAB = b.dataset.tab;
  document.querySelectorAll("#nav button[data-tab]").forEach(x=>x.classList.toggle("active", x===b));
  render();
});

// ---------- панель журнала: свернуть/развернуть ----------
const workspace = $("#workspace");
const logCollapsed = () => workspace.classList.contains("collapsed");
function setLogCollapsed(c){
  workspace.classList.toggle("collapsed", c);
  try{ localStorage.setItem("confdb.logCollapsed", c ? "1" : "0"); }catch(e){}
  $("#log-toggle").classList.toggle("active", !c);
}
$("#log-toggle").addEventListener("click", ()=>setLogCollapsed(!logCollapsed()));
$("#log-collapse").addEventListener("click", ()=>setLogCollapsed(true));
$("#scrim").addEventListener("click", ()=>setLogCollapsed(true));
let autoScroll = true;
$("#log-autoscroll").addEventListener("click", function(){
  autoScroll = !autoScroll; this.classList.toggle("on", autoScroll);
  if(autoScroll){ const l=$("#t-log"); l.scrollTop=l.scrollHeight; }
});
$("#log-copy").addEventListener("click", ()=>{
  const text=[...$("#t-log").children].map(d=>d.textContent).join("\n");
  if(navigator.clipboard) navigator.clipboard.writeText(text);
  toast("Журнал скопирован","ok");
});
(function initLogPanel(){
  let stored=null; try{ stored=localStorage.getItem("confdb.logCollapsed"); }catch(e){}
  // на узких экранах панель по умолчанию свёрнута (выдвижная), на широких — открыта
  setLogCollapsed(stored!==null ? stored==="1" : window.innerWidth<=1100);
})();
function render(){
  if(!S) return;
  const m = $("#main");
  if(TAB==="server") m.innerHTML = viewServer();
  else if(TAB==="extract") m.innerHTML = viewExtract();
  else if(TAB==="catalog") m.innerHTML = viewCatalog();
  else if(TAB==="groups") m.innerHTML = viewGroups();
  else if(TAB==="settings") m.innerHTML = viewSettings();
  bind();
}

// ---------- вкладка: MCP-сервер ----------
function viewServer(){
  const sv = S.server;
  if(!sv.running){
    const groups = Object.keys(S.groups);
    const gHtml = groups.length ? groups.map(n=>
      `<label><input type="checkbox" class="srv-group" value="${esc(n)}">
       <span><b>${esc(n)}</b> <span class="muted small">${esc(S.groups[n].map(p=>dbName(p)).join(", "))}</span></span></label>`).join("")
      : `<div class="empty">Групп нет — создайте на вкладке «Группы баз».</div>`;
    const dHtml = S.db_candidates.map(p=>
      `<label><input type="checkbox" class="srv-db" value="${esc(p)}"> ${dbBadge(p)} <span><b>${esc(dbName(p))}</b><div class="path">${esc(p)}</div></span></label>`).join("")
      || `<div class="empty">Базы не найдены — укажите каталог в настройках.</div>`;
    return `<div class="card"><h2>Запуск MCP-сервера</h2>
      <p class="muted small">Отметьте группы и/или отдельные базы. Группы откроются одновременно и останутся раздельными (запрос к группе — параметр <code>group</code>).</p>
      <h3>Группы баз</h3><div class="checks">${gHtml}</div>
      <h3>Отдельные базы</h3><div class="checks">${dHtml}</div>
      <div class="row" style="margin-top:14px">
        <div style="width:140px"><label>Порт</label><input type="number" id="srv-port" value="8765"></div>
        <button class="btn" id="srv-start" style="align-self:flex-end">Запустить сервер</button>
      </div></div>`;
  }
  const dbs = sv.dbs.map(d=>`<tr>
      <td>${dbBadge(d.path)}</td>
      <td>${d.active?'<span class="badge b-active">активна</span>':`<button class="btn ghost sm" data-use="${esc(d.alias)}">сделать активной</button>`}</td>
      <td><b>${esc(dbName(d.path))}</b> <span class="pill path">${esc(d.alias)}</span>${d.outdated?' <span class="badge b-outdated">устарела</span>':''}<div class="path">${esc(d.path)}</div></td>
      <td><button class="btn ghost sm" data-close="${esc(d.alias)}">закрыть</button></td></tr>`).join("")
    || `<tr><td colspan="4" class="empty">Нет открытых баз.</td></tr>`;
  const groups = sv.groups.map(g=>`<tr>
      <td>${g.active?'<span class="badge b-active">активна</span>':`<button class="btn ghost sm" data-guse="${esc(g.name)}">активировать</button>`}</td>
      <td><b>${esc(g.name)}</b><div class="muted small">${esc(g.aliases.join(", "))||"(пусто)"}</div></td>
      <td><button class="btn ghost sm" data-gclose="${esc(g.name)}">убрать</button></td></tr>`).join("")
    || `<tr><td colspan="3" class="empty">Групп в сервере нет.</td></tr>`;
  const cfgNames = Object.keys(S.groups);
  const cfgChecks = cfgNames.map(n=>
    `<label><input type="checkbox" class="cfg-add-check" value="${esc(n)}">
     <span><b>${esc(n)}</b> <span class="muted small">${esc(S.groups[n].map(p=>dbName(p)).join(", "))}</span></span></label>`).join("")
    || `<div class="empty">Групп в конфиге нет — создайте на вкладке «Группы баз».</div>`;
  const cfgGroups = cfgNames.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join("");
  // отдельные базы-кандидаты, ещё не открытые в сервере (выбор из списка)
  const openPaths = new Set(sv.dbs.map(d=>d.path));
  const availDbs = S.db_candidates.filter(p=>!openPaths.has(p));

const TYPE_KIND = {cf:"конфигурация", cfe:"расширение конфигурации",
                   epf:"внешняя обработка", erf:"внешний отчёт"};
const typeBadge = ext => `<span class="badge t-${esc(ext||'x')}" title="${esc(TYPE_KIND[ext]||'файл 1С')}">${esc((ext||"?").toUpperCase())}</span>`;
// классификация готовой базы (тип исходника + имя корневого объекта) — из snapshot
const dbMeta = p => (S && S.db_meta && S.db_meta[p]) || {};
const dbBadge = p => typeBadge(dbMeta(p).ext);
const dbName = p => dbMeta(p).name || base(p);
function viewCatalog(){
  const rows = scanRows.map((r,i)=>{
    const badge = r.status==="current"?'<span class="badge b-current">актуальна</span>'
      : r.status==="outdated"?'<span class="badge b-outdated">устарела</span>'
      : '<span class="badge b-new">новая</span>';
    const check = r.status==="current"?"":`<input type="checkbox" class="scan-check" data-i="${i}">`;
    const target = r.status==="current"?"":`<div class="path">→ ${esc(r.db)}${r.status==="outdated"?" (замена)":""}</div>`;
    // имя корневого объекта метаданных (из собранной базы); для новой базы — имя файла
    const title = r.name ? esc(r.name) : esc(base(r.src));
    const fname = r.name ? `<div class="path">${esc(base(r.src))}</div>` : "";
    const kind = r.root_type ? `<span class="muted small"> · ${esc(TYPE_KIND[r.ext]||r.root_type)}</span>` : "";
    return `<tr><td>${check}</td><td>${typeBadge(r.ext)}</td><td>${badge}</td>
      <td><b>${title}</b>${kind}${fname}${target}${r.note?`<div class="hint">${esc(r.note)}</div>`:""}</td></tr>`;
  }).join("");
  const table = scanRows.length?`<table><thead><tr><th></th><th>Тип</th><th>Статус</th><th>Конфигурация</th></tr></thead><tbody>${rows}</tbody></table>`
    :`<div class="empty">Нажмите «Сканировать», чтобы сверить файлы каталога с базами по SHA-256.</div>`;
  const actionable = scanRows.filter(r=>r.status!=="current").length;
  return `<div class="card"><h2>Каталог cf — новые и устаревшие конфигурации</h2>
    <div class="row"><div class="grow"><label>Каталог с файлами 1С</label>
      <input type="text" id="cat-dir" value="${esc(S.options.cf_dir)}" placeholder="D:\\cf"></div>

    <p class="hint">Сканирование считает SHA-256 каждого файла и сверяет с базами: <span class="badge b-current">актуальна</span> — уже собрана; <span class="badge b-outdated">устарела</span> — другой хэш, будет заменена; <span class="badge b-new">новая</span> — базы нет.</p>
    ${table}
    ${actionable?`<div class="row" style="margin-top:14px">
      <button class="btn" id="cat-selected">Извлечь выбранные</button>
      <button class="btn ok" id="cat-all">Все новые и устаревшие (${actionable})</button></div>`:""}

// ---------- привязка обработчиков ----------
function bind(){
  const on = (id,ev,fn)=>{ const el=$("#"+id); if(el) el.addEventListener(ev,fn); };
  const checked = id => $("#"+id) && $("#"+id).checked;

  // сервер
  on("srv-start","click",async()=>{
    const groups=[...document.querySelectorAll(".srv-group:checked")].map(x=>x.value);
    const dbs=[...document.querySelectorAll(".srv-db:checked")].map(x=>x.value);
    try{ const r=await api("/api/server/start","POST",{dbs,groups,port:val("srv-port")});
      if(r.missing&&r.missing.length) toast("Пропущены (нет файла): "+r.missing.map(base).join(", "),"info");
      toast("Сервер запущен на порту "+r.port,"ok"); await refresh();
    }catch(e){ toast(e.message,"err"); }
  });
  on("srv-stop","click",async()=>{ try{ await api("/api/server/stop","POST",{}); toast("Сервер остановлен, базы закрыты","ok"); await refresh(); }catch(e){ toast(e.message,"err"); } });
  on("copy-url","click",()=>{ navigator.clipboard&&navigator.clipboard.writeText($("#srv-url").textContent); toast("URL скопирован","ok"); });
  on("add-db-btn","click",async()=>{ const path=val("add-db-sel");
    if(!path){toast("Выберите базу из списка","err");return;}
    try{ const r=await api("/api/server/open","POST",{path}); toast("Открыта база: "+r.alias,"ok"); await refresh(); }catch(e){ toast(e.message,"err"); } });
  on("cfg-add-selected","click",addSelectedGroups);
  on("cfg-replace","click",()=>applyCfg(true));
  document.querySelectorAll("[data-use]").forEach(b=>b.onclick=async()=>{ try{ await api("/api/server/use","POST",{alias:b.dataset.use}); await refresh(); }catch(e){ toast(e.message,"err"); } });
  document.querySelectorAll("[data-close]").forEach(b=>b.onclick=async()=>{ try{ await api("/api/server/close","POST",{alias:b.dataset.close}); await refresh(); }catch(e){ toast(e.message,"err"); } });
  document.querySelectorAll("[data-guse]").forEach(b=>b.onclick=async()=>{ try{ await api("/api/server/group/use","POST",{name:b.dataset.guse}); await refresh(); }catch(e){ toast(e.message,"err"); } });
  document.querySelectorAll("[data-gclose]").forEach(b=>b.onclick=async()=>{ try{ await api("/api/server/group/close","POST",{name:b.dataset.gclose}); await refresh(); }catch(e){ toast(e.message,"err"); } });

  // извлечение
  on("ex-src-sel","change",()=>{ if(val("ex-src-sel")) $("#ex-src").value=val("ex-src-sel"); });
  on("ex-run","click",async()=>{ const src=val("ex-src").trim(); if(!src){toast("Укажите файл или каталог","err");return;}
    try{ await api("/api/extract","POST",{src,db:val("ex-db"),dump:val("ex-dump")}); toast("Извлечение запущено","ok"); pollTask(); }catch(e){ toast(e.message,"err"); } });
  on("fts-run","click",async()=>{ try{ await api("/api/fts","POST",{db:val("fts-db")}); toast("Построение FTS запущено","ok"); pollTask(); }catch(e){ toast(e.message,"err"); } });

  // каталог cf
  on("cat-save","click",async()=>{ try{ await api("/api/options","POST",{cf_dir:val("cat-dir")}); toast("Каталог сохранён","ok"); await refresh(); }catch(e){ toast(e.message,"err"); } });
  on("cat-scan","click",async()=>{ try{ await api("/api/options","POST",{cf_dir:val("cat-dir")}); await api("/api/scan","POST",{}); toast("Сканирование запущено","ok"); pollTask(); }catch(e){ toast(e.message,"err"); } });
  on("cat-selected","click",()=>batchSelected(false));
  on("cat-all","click",()=>batchSelected(true));

  // группы
  on("grp-save","click",async()=>{ const name=val("grp-name").trim(); if(!name){toast("Укажите имя группы","err");return;}

    try{ await api("/api/groups","POST",{name,paths}); toast("Группа сохранена","ok"); await refresh(); }catch(e){ toast(e.message,"err"); } });
  on("grp-reset","click",()=>{ $("#grp-name").value=""; document.querySelectorAll(".grp-db").forEach(x=>x.checked=false); $("#grp-form-title").textContent="Создать группу"; });

    const set=new Set(S.groups[n]||[]); document.querySelectorAll(".grp-db").forEach(x=>x.checked=set.has(x.value)); window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"}); });

async function applyCfg(replace){
  const name=val("cfg-group"); if(!name){toast("Нет групп в конфиге","err");return;}
  try{ const r=await api("/api/server/apply_group","POST",{name,replace});
    const res=r.result; toast("Группа "+res[0]+": "+(res[1].join(", ")||"без баз"), "ok");
    if(res[2]&&res[2].length) toast("Ошибки: "+res[2].join("; "),"err"); await refresh();
  }catch(e){ toast(e.message,"err"); }
}
async function addSelectedGroups(){
  const names=[...document.querySelectorAll(".cfg-add-check:checked")].map(x=>x.value);
  if(!names.length){toast("Отметьте хотя бы одну группу","err");return;}
  const errors=[]; let added=0;
  for(const name of names){
    try{ const r=await api("/api/server/apply_group","POST",{name,replace:false});
      const res=r.result; added++;
      if(res[2]&&res[2].length) errors.push(name+": "+res[2].join("; "));
    }catch(e){ errors.push(name+": "+e.message); }
  }
  toast("Добавлено групп: "+added+" из "+names.length, errors.length?"err":"ok");
  if(errors.length) toast(errors.join(" | "),"err");
  await refresh();
}
function batchSelected(all){
  let items;
  if(all) items=scanRows.filter(r=>r.status!=="current");
  else items=[...document.querySelectorAll(".scan-check:checked")].map(x=>scanRows[+x.dataset.i]);
  if(!items.length){toast("Не выбрано ни одной конфигурации","err");return;}
  const repl=items.filter(r=>r.status==="outdated").length;
  if(!confirm("Извлечь "+items.length+" конфигурац."+ (repl?" (с заменой баз: "+repl+")":"") +"?"))return;
  api("/api/extract_batch","POST",{items:items.map(r=>({src:r.src,db:r.db,sha:r.sha}))})
    .then(()=>{toast("Пакетное извлечение запущено","ok");pollTask();})
    .catch(e=>toast(e.message,"err"));
}

// ---------- задачи ----------
let lastRunningId = null;
let logSig = null;
const fmtDur = s => { s=Math.max(0,Math.round(s)); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); };
// строки журнала с подсветкой стадий/итога/ошибок; перерисовка только при
// изменении содержимого (экранирование обязательно — журнал из stdout сервера)
function renderLog(lines){
  const sig = lines.length + "\u0000" + (lines[lines.length-1] || "");
  if(sig === logSig) return;
  logSig = sig;
  $("#t-log").innerHTML = lines.map(ln=>{
    let cls = "ll";
    if(/^Стадия|Пишем базу|Строим FTS|Бенчмарк:/.test(ln)) cls += " ll-stage";
    else if(/^Готово|Извлечение не требуется/.test(ln)) cls += " ll-ok";
    else if(/Ошибка|error|Traceback/i.test(ln)) cls += " ll-err";
    else if(/^SHA-256|^Хэш /.test(ln)) cls += " ll-dim";
    return '<div class="' + cls + '">' + esc(ln) + '</div>';
  }).join("");
}
async function pollTask(){
  try{
    const {task} = await api("/api/task");
    const title=$("#t-title"), status=$("#t-status"), dot=$("#t-dot"), log=$("#t-log"),
          spin=$("#t-spin"), foot=$("#t-foot"), empty=$("#log-empty"), toggle=$("#log-toggle");
    if(!task){
      title.textContent="Журнал задач"; status.textContent="Задачи не запускались";
      dot.className="dot"; spin.style.display="none";
      log.innerHTML=""; logSig=null; log.style.display="none"; empty.style.display="flex";
      foot.textContent=""; toggle.classList.remove("running");
      return;
    }
    empty.style.display="none"; log.style.display="block";
    title.textContent=task.title;
    const running = task.status==="running";
    spin.style.display = running ? "inline-block" : "none";
    dot.className = "dot " + (running ? "run" : task.status==="done" ? "done" : "err");
    status.textContent = running ? "выполняется…" : task.status==="done" ? "готово" : "ошибка";
    toggle.classList.toggle("running", running);
    renderLog(task.log);
    if(autoScroll) log.scrollTop = log.scrollHeight;
    const elapsed = (task.finished || Date.now()/1000) - task.started;
    foot.textContent = (running ? "Прошло " : "Заняло ") + fmtDur(elapsed)
      + (task.error ? " · " + task.error : "");
    // новая задача запустилась — раскрываем панель, чтобы было видно прогресс
    if(running && task.id!==lastRunningId){
      lastRunningId = task.id; logSig = null;
      if(logCollapsed()) setLogCollapsed(false);
    }
    if(!running && task.id!==lastTaskId){
      lastTaskId=task.id;
      if(task.status==="done"){
        if(task.kind==="scan"){ scanRows=task.result||[]; toast("Сканирование завершено","ok"); }
        else if(task.kind==="batch"){ const r=task.result; toast("Извлечено: "+r.done.length+", ошибок: "+r.failed.length, r.failed.length?"err":"ok"); }
        else if(task.kind==="bench"){ toast("Бенчмарк: рекомендовано процессов "+task.result,"ok"); }
        else toast("Задача завершена","ok");
        await refresh();
      } else { toast(task.error||"Ошибка задачи","err"); }
    }
  }catch(e){ /* сервер недоступен — тихо */ }
}
setInterval(pollTask, 1000);
setInterval(()=>{ if(TAB==="server" && S && S.server.running) refresh(); }, 3000);
pollTask();
refresh().catch(e=>toast("Не удалось загрузить состояние: "+e.message,"err"));
</script>
